idth="216" height="92" rx="30" fill="#12295d" stroke="#1b477d" stroke-width="2"/><text x="648" y="1222" fill="#c8e7f6">45 min</text><rect x="774" y="1165" width="234" height="92" rx="30" fill="#159fe3"/><text x="891" y="1222" fill="#fff" font-weight="700">60 min</text></g><rect x="72" y="1340" width="936" height="232" rx="36" fill="#12295d" stroke="#1b477d" stroke-width="2"/><text x="110" y="1418" fill="#e8f8ff" font-family="sans-serif" font-weight="700" font-size="31">Made for bedtime listening</text><text x="110" y="1486" fill="#9eb8d7" font-family="sans-serif" font-size="29">Music, podcasts, audiobooks, and ambient</text><text x="110" y="1534" fill="#9eb8d7" font-family="sans-serif" font-size="29">audio can end gently while you fall asleep.</text><rect x="72" y="1648" width="936" height="122" rx="38" fill="url(#c)"/><text x="540" y="1725" text-anchor="middle" fill="#04143a" font-family="sans-serif" font-weight="700" font-size="36">Start timer</text><text x="72" y="1838" fill="#78c9ec" font-family="sans-serif" font-size="27">Up to 120 minutes.</text></svg>
